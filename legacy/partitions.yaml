# Partitions per hosting entity (EFP marketplace offerings).
#
# Reconciled with the live API output of allocations_partitions_analyser.py
# (https://allocations.my-eurohpc.eu/api/marketplace-public-offerings/).
#
# - `partition_name` matches the API field name.
# - Values are normalized to the "arch/family/microarch" convention even where
#   the API returns free-text descriptions (e.g. "2x AMD EPYC Rome 7H12 64c").
# - Some items may disagree with the live API and need updating in Allocations
# - The API "Test Slurm" / "Test Slurm 2" offerings were intentionally excluded.

Arrhenius CPU:
  partitions:
    - partition_name: cpu
      cpu_arch: x86_64/amd/zen5
      gpu_arch: null
      qos: []
    - partition_name: fat
      cpu_arch: x86_64/amd/zen5
      gpu_arch: null
      qos: []
Arrhenius GPU:
  partitions:
    - partition_name: gpu
      cpu_arch: aarch64/nvidia/grace
